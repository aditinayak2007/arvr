<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#0b0f19" stroke="url(#cyanGrad)" stroke-width="3" />
  <!-- Futuristic Car Silhouette & AR Reticle -->
  <path d="M25,58 L35,46 L65,46 L75,58 L82,60 C84,60 85,62 85,64 L83,70 C83,72 81,73 78,73 L22,73 C19,73 17,72 17,70 L15,64 C15,62 16,60 18,60 Z" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wheels -->
  <circle cx="32" cy="72" r="7" fill="#07090e" stroke="url(#cyanGrad)" stroke-width="2.5" />
  <circle cx="68" cy="72" r="7" fill="#07090e" stroke="url(#cyanGrad)" stroke-width="2.5" />
  <circle cx="32" cy="72" r="2.5" fill="#38bdf8" />
  <circle cx="68" cy="72" r="2.5" fill="#38bdf8" />
  <!-- AR Crosshair/Wings -->
  <path d="M40,32 L50,22 L60,32" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="50" cy="22" r="2" fill="#ffffff" />
</svg>